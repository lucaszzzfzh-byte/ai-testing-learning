name: 自动化测试

on: [push]           # 触发条件：每次 push 就执行

jobs:
  test:
    runs-on: ubuntu-latest   # 用最新 Ubuntu 虚拟机
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: pip install requests pytest

      - name: 执行测试
        run: pytest test_api.py -v --html=report.html --self-contained-html